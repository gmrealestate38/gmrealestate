<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Properties | GM Real Estate</title>

 {% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <div class="nav-container">
        <a href="/"  class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11l9-8 9 8"></path>
              <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
            </svg>
          </div>
          <div class="logo-text">
            <p class="logo-title">GM REAL ESTATE</p>
            <p class="logo-subtitle">Find Your Dream Property</p>
          </div>
        </a>

        <div class="nav-actions">
          <a href="/"  class="btn btn-outline">&larr; Back to Home</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="listings-container">
      <h2>Saved Properties</h2>
      <p class="past-projects-subtitle">Yeh woh properties hain jo aapne ❤️ Save button se save ki hain.</p>

      <div id="savedGrid" class="listings-grid">
        <!-- Dynamic cards loaded here via saved-properties.js -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 GM Real Estate. All rights reserved.</p>
    </div>
  </footer>

  <script src="{% static 'js/saved-properties.js' %}"></script>
</body>
</html>
